server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ---- 真实客户端 IP 还原（多层反向代理）----
    # 本容器常被宿主机上的 nginx / 宝塔面板 / 云负载均衡再代理一层，此时到达
    # 本层的 $remote_addr 是**上一跳**（127.0.0.1 或 docker 网关），而不是客户端。
    # 若下面仍写 `proxy_set_header X-Real-IP $remote_addr`，就会把上游已经还原好的
    # 真实 IP 覆盖成本机地址 —— 表现为「所有用户登录 IP 都是 127.0.0.1」。
    # 用 realip 模块信任上游网段后，$remote_addr 会被还原成真实客户端地址。
    #
    # 这里**只信任回环与 docker 默认网段**，把伪造面压到最小：
    #   * 上游（宿主机 nginx / 面板）经 127.0.0.1 或 docker 网关转发 → 命中，正确还原；
    #   * 客户端直连容器端口（对端不在可信段）→ realip 不生效，$remote_addr 仍是对端真实地址，
    #     伪造的 X-Forwarded-For 不会被采信。
    # ⚠️ 若上游代理不在下列网段（例如宿主机以 10.x / 192.168.x 连入），**必须**自行补进
    #    set_real_ip_from；否则 realip 不生效、$remote_addr 保持为上游代理地址，
    #    X-Real-IP 于是被写成**代理自身地址**，登录 IP 就记成代理地址
    #    —— 不再全是 127.0.0.1，但**仍然是错的**（错成另一个固定值）。
    #    （也可改在**后端**用 TRUSTED_PROXY_CIDRS 声明该网段，二选一。）
    set_real_ip_from 127.0.0.1;
    set_real_ip_from 172.16.0.0/12;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # 静态资源缓存（7 天）
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # API 反代到后端
    location /api {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 20m;
    }

    # 上传文件访问
    location /uploads {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
    }

    # SPA 路由回退
    location / {
        try_files $uri $uri/ /index.html;
    }
}
